[project]
name = "lineage-vault"
version = "0.1.0"
description = "Decentralized data lineage and cryptographically verified audit ledger"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.0",
  "networkx>=3.0",
  "jsonschema>=4.0",
  "httpx>=0.27",
]
[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "hypothesis>=6.0", "ruff>=0.8"]
[project.scripts]
lineage-vault = "lineage_vault.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/lineage_vault"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
