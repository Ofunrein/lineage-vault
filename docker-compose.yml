services:
  lineage-vault:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - vault-data:/app/.data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vault-data:
